version: 2
# Both updates use the same cron expression, in UTC.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 * * 1' # Monday 09:00 UTC
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 * * 1' # Monday 09:00 UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
