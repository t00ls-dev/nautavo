name: Lighthouse
# Audits the published site on Dependabot's schedule and on demand. Not a
# required check; it never builds or publishes.
on:
  schedule:
    # Minute 17, not 0: GitHub delays scheduled runs at the top of the hour,
    # when most schedules fire, and may drop them (the 09:00 run of
    # 2026-11-16 never started). Same expression as Dependabot.
    - cron: '17 9 * * 1' # Monday 09:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse
  cancel-in-progress: false
jobs:
  audit:
    name: Lighthouse audit of the live site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run lighthouse
        env:
          TARGET_URL: https://nautavo.com/
          RUNS: 3
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .lighthouse.local/summary.md ]; then
            cat .lighthouse.local/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouse.local/
          include-hidden-files: true
          retention-days: 30
