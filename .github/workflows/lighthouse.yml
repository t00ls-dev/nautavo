name: Lighthouse
# Audits the published site on demand only. Not a required check; it never
# builds or publishes.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse
  cancel-in-progress: false
jobs:
  audit:
    name: Lighthouse audit of the live site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run lighthouse
        env:
          TARGET_URL: https://nautavo.com/
          RUNS: 3
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .lighthouse.local/summary.md ]; then
            cat .lighthouse.local/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouse.local/
          include-hidden-files: true
          retention-days: 30
